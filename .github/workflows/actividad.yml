name: Actualizar actividad

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actividad:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar gráfico
        env:
          GITHUB_TOKEN: ${{ secrets.PERFIL_TOKEN }}
          USUARIO: ${{ github.repository_owner }}
        run: |
          # Con el token de Actions solo se ven contribuciones públicas; sin PERFIL_TOKEN no se toca el gráfico.
          if [ -z "$GITHUB_TOKEN" ]; then echo "Falta el secreto PERFIL_TOKEN"; exit 0; fi
          python .github/scripts/actividad.py
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/actividad.svg
          git diff --cached --quiet || git commit -m "chore: actualizar actividad"
          git push
