    <path d="M0 332 C110 316 220 346 330 332 S410 324 440 334 L440 350 L0 350 Z" fill="#14532D" fill-opacity=".35"/>
  </g>
  <rect x=".5" y=".5" width="439" height="349" rx="14" fill="none" stroke="#1B3A29"/>
  <rect x="24" y="22" width="129" height="22" rx="11" fill="#22C55E" fill-opacity=".14"/>
  <text x="88" y="37" font-size="10.5" text-anchor="middle" fill="#4ADE80" class="mono">PROTOTIPO · DEMO</text>
  <text x="24" y="78" font-size="25" font-weight="700" fill="#F0FDF4">Nexo Ubicaciones</text>
  <text x="24" y="102" font-size="13" fill="#86A394">Registro móvil de domicilios para equipos de campo.</text>
  <circle cx="30" cy="128" r="2.5" fill="#22C55E"/><text x="42" y="132" font-size="13" fill="#C7DDD0">Captura la ubicación real del dispositivo, con</text><text x="42" y="151" font-size="13" fill="#C7DDD0">precisión y hora.</text><circle cx="30" cy="171" r="2.5" fill="#22C55E"/><text x="42" y="175" font-size="13" fill="#C7DDD0">Avisa si la precisión es baja y pide repetir la</text><text x="42" y="194" font-size="13" fill="#C7DDD0">captura.</text><circle cx="30" cy="214" r="2.5" fill="#22C55E"/><text x="42" y="218" font-size="13" fill="#C7DDD0">Descarga las coordenadas en CSV compatible con</text><text x="42" y="237" font-size="13" fill="#C7DDD0">Excel.</text><circle cx="30" cy="257" r="2.5" fill="#22C55E"/><text x="42" y="261" font-size="13" fill="#C7DDD0">Panel de administración para PC (en demostración).</text>
  <rect x="24" y="288" width="89" height="22" rx="11" fill="#22C55E" fill-opacity=".1" stroke="#22C55E" stroke-opacity=".35"/><text x="68" y="303" font-size="11" text-anchor="middle" fill="#86EFAC" class="mono">JavaScript</text><rect x="121" y="288" width="48" height="22" rx="11" fill="#22C55E" fill-opacity=".1" stroke="#22C55E" stroke-opacity=".35"/><text x="145" y="303" font-size="11" text-anchor="middle" fill="#86EFAC" class="mono">HTML</text><rect x="177" y="288" width="41" height="22" rx="11" fill="#22C55E" fill-opacity=".1" stroke="#22C55E" stroke-opacity=".35"/><text x="197" y="303" font-size="11" text-anchor="middle" fill="#86EFAC" class="mono">CSS</text><rect x="225" y="288" width="61" height="22" rx="11" fill="#22C55E" fill-opacity=".1" stroke="#22C55E" stroke-opacity=".35"/><text x="256" y="303" font-size="11" text-anchor="middle" fill="#86EFAC" class="mono">Vercel</text>
