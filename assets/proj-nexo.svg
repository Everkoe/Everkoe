<svg xmlns="http://www.w3.org/2000/svg" width="440" height="350" viewBox="0 0 440 350" role="img" aria-label="Nexo Ubicaciones: Registro móvil de domicilios para equipos de campo.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B14"/><stop offset="1" stop-color="#0A1F14"/></linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0B1120"/><stop offset="1" stop-color="#22C55E"/></linearGradient>
    <clipPath id="c"><rect width="440" height="350" rx="14"/></clipPath>
  </defs>
  <style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
  <g clip-path="url(#c)">
