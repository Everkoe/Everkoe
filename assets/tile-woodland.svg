<svg xmlns="http://www.w3.org/2000/svg" width="440" height="100" viewBox="0 0 440 100" role="img" aria-label="Woodland Perú: Web comercial para una empresa de teca (hackatón)">
  <style>
    text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .bg{fill:#FAF1E8}.ac{fill:#C2783C}.st{fill:#7C4A1E}.n{fill:#1F2328}.d{fill:#59636E}.ring{stroke:#C2783C}
    @media (prefers-color-scheme:dark){.bg{fill:#2A1C10}.ac{fill:#D89A62}.st{fill:#F3D9C2}.n{fill:#E6EDF3}.d{fill:#9198A1}.ring{stroke:#D89A62}}
  </style>
  <rect width="440" height="100" rx="16" class="bg"/>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".6s" begin="0.15s" fill="freeze"/>
    <circle cx="42" cy="50" r="20" class="ac"/>
    <text x="42" y="56.5" font-size="17" font-weight="700" text-anchor="middle" fill="#FFFFFF">W</text>
    <text x="76" y="45" font-size="17" font-weight="600" class="n">Woodland Perú</text>
    <text x="76" y="68" font-size="13.5" class="d">Web comercial para una empresa de teca</text>
    <text x="418" y="30" font-size="12" font-weight="500" text-anchor="end" class="st">hackatón ↗</text>
  </g>
</svg>
