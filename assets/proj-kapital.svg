<svg xmlns="http://www.w3.org/2000/svg" width="440" height="350" viewBox="0 0 440 350" role="img" aria-label="Kapital Routing: Programación de turnos y flota para transporte de personal.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B14"/><stop offset="1" stop-color="#0A1F14"/></linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0B1120"/><stop offset="1" stop-color="#22C55E"/></linearGradient>
    <clipPath id="c"><rect width="440" height="350" rx="14"/></clipPath>
  </defs>
  <style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
  <g clip-path="url(#c)">
    <rect width="440" height="350" fill="url(#bg)"/>
    <rect width="440" height="4" fill="url(#top)"/>
    <path d="M0 332 C110 316 220 346 330 332 S410 324 440 334 L440 350 L0 350 Z" fill="#14532D" fill-opacity=".35"/>
  </g>
  <rect x=".5" y=".5" width="439" height="349" rx="14" fill="none" stroke="#1B3A29"/>
  <rect x="24" y="22" width="176" height="22" rx="11" fill="#22C55E" fill-opacity=".14"/>
  <text x="112" y="37" font-size="10.5" text-anchor="middle" fill="#4ADE80" class="mono">EN PRODUCCIÓN · PRIVADO</text>
  <text x="24" y="78" font-size="25" font-weight="700" fill="#F0FDF4">Kapital Routing</text>
  <text x="24" y="102" font-size="13" fill="#86A394">Programación de turnos y flota para transporte de personal.</text>
  <circle cx="30" cy="128" r="2.5" fill="#22C55E"/><text x="42" y="132" font-size="13" fill="#C7DDD0">Crea el turno desde la semanal del cliente y</text><text x="42" y="151" font-size="13" fill="#C7DDD0">reutiliza la unidad de cada servicio repetido.</text><circle cx="30" cy="171" r="2.5" fill="#22C55E"/><text x="42" y="175" font-size="13" fill="#C7DDD0">Valida reservas de unidad, conductor y horario en la</text><text x="42" y="194" font-size="13" fill="#C7DDD0">base de datos.</text><circle cx="30" cy="214" r="2.5" fill="#22C55E"/><text x="42" y="218" font-size="13" fill="#C7DDD0">Historial con deshacer y rehacer, Excel y zonas de</text><text x="42" y="237" font-size="13" fill="#C7DDD0">cobertura en mapa.</text><circle cx="30" cy="257" r="2.5" fill="#22C55E"/><text x="42" y="261" font-size="13" fill="#C7DDD0">Más de 980 pruebas de frontend y 765 de backend.</text>
  <rect x="24" y="288" width="54" height="22" rx="11" fill="#22C55E" fill-opacity=".1" stroke="#22C55E" stroke-opacity=".35"/><text x="51" y="303" font-size="11" text-anchor="middle" fill="#86EFAC" class="mono">React</text><rect x="86" y="288" width="48" height="22" rx="11" fill="#22C55E" fill-opacity=".1" stroke="#22C55E" stroke-opacity=".35"/><text x="110" y="303" font-size="11" text-anchor="middle" fill="#86EFAC" class="mono">Vite</text><rect x="142" y="288" width="61" height="22" rx="11" fill="#22C55E" fill-opacity=".1" stroke="#22C55E" stroke-opacity=".35"/><text x="173" y="303" font-size="11" text-anchor="middle" fill="#86EFAC" class="mono">Python</text><rect x="212" y="288" width="68" height="22" rx="11" fill="#22C55E" fill-opacity=".1" stroke="#22C55E" stroke-opacity=".35"/><text x="246" y="303" font-size="11" text-anchor="middle" fill="#86EFAC" class="mono">FastAPI</text><rect x="288" y="288" width="89" height="22" rx="11" fill="#22C55E" fill-opacity=".1" stroke="#22C55E" stroke-opacity=".35"/><text x="332" y="303" font-size="11" text-anchor="middle" fill="#86EFAC" class="mono">PostgreSQL</text><rect x="24" y="316" width="75" height="22" rx="11" fill="#22C55E" fill-opacity=".1" stroke="#22C55E" stroke-opacity=".35"/><text x="62" y="331" font-size="11" text-anchor="middle" fill="#86EFAC" class="mono">Supabase</text><rect x="107" y="316" width="61" height="22" rx="11" fill="#22C55E" fill-opacity=".1" stroke="#22C55E" stroke-opacity=".35"/><text x="138" y="331" font-size="11" text-anchor="middle" fill="#86EFAC" class="mono">Vercel</text><rect x="177" y="316" width="117" height="22" rx="11" fill="#22C55E" fill-opacity=".1" stroke="#22C55E" stroke-opacity=".35"/><text x="235" y="331" font-size="11" text-anchor="middle" fill="#86EFAC" class="mono">GitHub Actions</text>
</svg>