<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64" role="img" aria-label="Kapital Routing: Turnos y flota para transporte de personal (en producción)">
  <defs>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22C55E" stop-opacity=".55"/><stop offset=".6" stop-color="#22C55E" stop-opacity=".12"/><stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .n{font-family:Georgia,'Times New Roman',serif;fill:#1F2328}
    .d{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#59636E}
    .i{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#16A34A}
    .ac{fill:#16A34A;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .pb{fill:#DCFCE7}.pt{fill:#166534;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    @media (prefers-color-scheme:dark){.n{fill:#E6EDF3}.d{fill:#9198A1}.i,.ac{fill:#4ADE80}.pb{fill:#14532D}.pt{fill:#BBF7D0}}
  </style>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur=".6s" begin="0.00s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-12 0" to="0 0" dur=".6s" begin="0.00s" fill="freeze"/>
    <text x="2" y="37" font-size="12" class="i">01</text>
    <text x="40" y="39" font-size="22" class="n">Kapital Routing</text>
    <text x="270" y="37" font-size="14.5" class="d">Turnos y flota para transporte de personal</text>
    <rect x="750" y="20" width="114" height="24" rx="12" class="pb"/>
    <text x="807" y="36" font-size="12" text-anchor="middle" class="pt">en producción</text>
    
  </g>
  <rect x="0" y="63" width="900" height="1" fill="url(#ln)"/>
</svg>
