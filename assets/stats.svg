<svg xmlns="http://www.w3.org/2000/svg" width="900" height="130" viewBox="0 0 900 130" role="img" aria-label="Cifras de Kapital Routing">
  <defs>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14532D"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.1s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur="0.7s" begin="0.1s" fill="freeze"/>
      <rect x="4" y="8" width="212" height="114" rx="16" fill="url(#c)" stroke="#22C55E" stroke-opacity="0.5">
        <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
      </rect>
      <text x="110" y="62" font-size="38" font-weight="800" fill="#FFFFFF">980+</text>
      <text x="110" y="92" font-size="13" fill="#86EFAC">pruebas de frontend</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.3s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur="0.7s" begin="0.3s" fill="freeze"/>
      <rect x="231" y="8" width="212" height="114" rx="16" fill="url(#c)" stroke="#22C55E" stroke-opacity="0.5">
        <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="3s" begin="0.5s" repeatCount="indefinite"/>
      </rect>
      <text x="337" y="62" font-size="38" font-weight="800" fill="#FFFFFF">765+</text>
      <text x="337" y="92" font-size="13" fill="#86EFAC">pruebas de backend</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur="0.7s" begin="0.5s" fill="freeze"/>
      <rect x="458" y="8" width="212" height="114" rx="16" fill="url(#c)" stroke="#22C55E" stroke-opacity="0.5">
        <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="3s" begin="1s" repeatCount="indefinite"/>
      </rect>
      <text x="564" y="62" font-size="38" font-weight="800" fill="#FFFFFF">2</text>
      <text x="564" y="92" font-size="13" fill="#86EFAC">operaciones en producción</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.7s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur="0.7s" begin="0.7s" fill="freeze"/>
      <rect x="685" y="8" width="212" height="114" rx="16" fill="url(#c)" stroke="#22C55E" stroke-opacity="0.5">
        <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      </rect>
      <text x="791" y="62" font-size="38" font-weight="800" fill="#FFFFFF">CI/CD</text>
      <text x="791" y="92" font-size="13" fill="#86EFAC">GitHub Actions + Vercel</text>
    </g>
  </g>
</svg>
