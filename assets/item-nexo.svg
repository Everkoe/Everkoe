<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64" role="img" aria-label="Nexo Ubicaciones: Registro de domicilios con ubicación real (prototipo)">
  <defs>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22C55E" stop-opacity=".55"/><stop offset=".6" stop-color="#22C55E" stop-opacity=".12"/><stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .n{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:600;letter-spacing:-.2px;fill:#1F2328}
    .d{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#59636E}
    .i{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#16A34A}
    .ac{fill:#16A34A;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .pb{fill:#CCFBF1}.pt{fill:#115E59;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    @media (prefers-color-scheme:dark){.n{fill:#E6EDF3}.d{fill:#9198A1}.i,.ac{fill:#4ADE80}.pb{fill:#134E4A}.pt{fill:#99F6E4}}
  </style>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur=".6s" begin="0.24s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-12 0" to="0 0" dur=".6s" begin="0.24s" fill="freeze"/>
    <text x="2" y="37" font-size="12" class="i">03</text>
    <text x="40" y="39" font-size="19" class="n">Nexo Ubicaciones</text>
    <text x="270" y="37" font-size="14.5" class="d">Registro de domicilios con ubicación real</text>
    <rect x="777" y="20" width="87" height="24" rx="12" class="pb"/>
    <text x="820" y="36" font-size="12" text-anchor="middle" class="pt">prototipo</text>
    <text x="898" y="36" font-size="16" text-anchor="end" class="ac">↗</text>
  </g>
  <rect x="0" y="63" width="900" height="1" fill="url(#ln)"/>
</svg>
