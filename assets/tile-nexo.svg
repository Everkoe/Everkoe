<svg xmlns="http://www.w3.org/2000/svg" width="440" height="100" viewBox="0 0 440 100" role="img" aria-label="Nexo Ubicaciones: Registro de domicilios con ubicación real (prototipo)">
  <style>
    text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .bg{fill:#E9FBF7}.ac{fill:#14B8A6}.st{fill:#115E59}.n{fill:#1F2328}.d{fill:#59636E}.ring{stroke:#14B8A6}
    @media (prefers-color-scheme:dark){.bg{fill:#0E2A27}.ac{fill:#2DD4BF}.st{fill:#99F6E4}.n{fill:#E6EDF3}.d{fill:#9198A1}.ring{stroke:#2DD4BF}}
  </style>
  <rect width="440" height="100" rx="16" class="bg"/>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".6s" begin="0.25s" fill="freeze"/>
    <circle cx="42" cy="50" r="20" class="ac"/>
    <text x="42" y="56.5" font-size="17" font-weight="700" text-anchor="middle" fill="#FFFFFF">N</text>
    <text x="76" y="45" font-size="17" font-weight="600" class="n">Nexo Ubicaciones</text>
    <text x="76" y="68" font-size="13.5" class="d">Registro de domicilios con ubicación real</text>
    <text x="418" y="30" font-size="12" font-weight="500" text-anchor="end" class="st">prototipo ↗</text>
  </g>
</svg>
