<svg xmlns="http://www.w3.org/2000/svg" width="440" height="210" viewBox="0 0 440 210" role="img" aria-label="RutaFix">
  <style>
    text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .card{fill:#F6F8FA;stroke:#D0D7DE}.ink{fill:#1F2328}.mu{fill:#656D76}
    .ac{fill:#BC4C00}.acs{stroke:#BC4C00;fill:none}.acbg{fill:#BC4C00;fill-opacity:.1}
    @media (prefers-color-scheme:dark){
      .card{fill:#161B22;stroke:#30363D}.ink{fill:#E6EDF3}.mu{fill:#8B949E}
      .ac{fill:#F0883E}.acs{stroke:#F0883E}.acbg{fill:#F0883E;fill-opacity:.14}
    }
  </style>
  <rect x=".5" y=".5" width="439" height="209" rx="12" class="card"/>
  <text x="24" y="38" font-size="11" class="ac mono">UNIVERSIDAD · EQUIPO</text>
  <text x="24" y="68" font-size="24" font-weight="700" class="ink">RutaFix</text>
  <g font-size="13" class="mu">
    <text x="24" y="98">Rutas de intervención vial con</text>
    <text x="24" y="117">K-Means y heurísticas de TSP.</text>
    <text x="24" y="136">Arquitectura DDD.</text>
  </g>
  <text x="24" y="184" font-size="11" class="mu mono">Python · FastAPI · React · Leaflet</text>

  <circle cx="302" cy="76" r="30" class="acbg"/>
  <circle cx="388" cy="62" r="26" class="acbg"/>
  <circle cx="346" cy="146" r="32" class="acbg"/>
  <path d="M302 76 L388 62 L346 146 Z" class="acs" stroke-width="1.6" stroke-dasharray="5 5" stroke-linejoin="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="3s" repeatCount="indefinite"/>
  </path>
  <g class="ac">
    <circle cx="290" cy="66" r="3"/><circle cx="312" cy="62" r="3"/><circle cx="296" cy="90" r="3"/><circle cx="318" cy="84" r="3"/>
    <circle cx="378" cy="50" r="3"/><circle cx="398" cy="58" r="3"/><circle cx="384" cy="74" r="3"/>
    <circle cx="332" cy="136" r="3"/><circle cx="358" cy="132" r="3"/><circle cx="340" cy="160" r="3"/><circle cx="362" cy="154" r="3"/>
  </g>
  <g class="ac"><circle cx="302" cy="76" r="5.5"/><circle cx="388" cy="62" r="5.5"/><circle cx="346" cy="146" r="5.5"/></g>
  <text x="408" y="188" font-size="10" text-anchor="end" class="mu mono">k = 3</text>
</svg>
