<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Anyelo Alejos, Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#0B3B24"/>
      <stop offset="1" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#86EFAC"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#22C55E" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="250" rx="18" fill="url(#bg)"/>
  <rect width="900" height="250" rx="18" fill="url(#grid)"/>

  <!-- ruta animada -->
  <path id="route" d="M30 228 C 170 175, 290 245, 450 200 S 740 150, 872 214"
        fill="none" stroke="#22C55E" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="7 9" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.6s" repeatCount="indefinite"/>
  </path>

  <!-- paradas -->
  <g fill="#22C55E" filter="url(#glow)">
    <circle cx="30" cy="228" r="6"><animate attributeName="r" values="5;8;5" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="200" r="6"><animate attributeName="r" values="5;8;5" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="872" cy="214" r="6"><animate attributeName="r" values="5;8;5" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- vehículo -->
  <g filter="url(#glow)">
    <circle r="7" fill="#FFFFFF">
      <animateMotion dur="7s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#route"/></animateMotion>
    </circle>
    <circle r="12" fill="none" stroke="#86EFAC" stroke-opacity="0.7">
      <animateMotion dur="7s" repeatCount="indefinite"><mpath xlink:href="#route"/></animateMotion>
      <animate attributeName="r" values="8;16;8" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.8;0;0.8" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- puntos flotantes -->
  <g fill="#86EFAC">
    <circle cx="760" cy="48" r="2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="90" r="1.6"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="86" r="1.8"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.5s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="40" r="1.4"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.8s" begin="1.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- texto -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="48" y="92" font-size="50" font-weight="800" fill="url(#name)" opacity="0">
      Anyelo Alejos
      <animate attributeName="opacity" from="0" to="1" dur="0.9s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="-24 0" to="0 0" dur="0.9s" fill="freeze"/>
    </text>
    <text x="50" y="128" font-size="22" font-weight="600" fill="#86EFAC" opacity="0">
      Full Stack Developer
      <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="-24 0" to="0 0" dur="0.9s" begin="0.4s" fill="freeze"/>
    </text>
    <text x="50" y="156" font-size="15" fill="#CBD5E1" opacity="0" letter-spacing="1">
      React  ·  Python  ·  PostgreSQL  ·  Lima, Perú
      <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.8s" fill="freeze"/>
    </text>
  </g>
</svg>
