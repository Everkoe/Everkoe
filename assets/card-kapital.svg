<svg xmlns="http://www.w3.org/2000/svg" width="440" height="210" viewBox="0 0 440 210" role="img" aria-label="Kapital Routing">
  <style>
    text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .card{fill:#F6F8FA;stroke:#D0D7DE}.ink{fill:#1F2328}.mu{fill:#656D76}.track{fill:#D0D7DE}
    .ac{fill:#1A7F37}.acbg{fill:#1A7F37;fill-opacity:.12}
    @media (prefers-color-scheme:dark){
      .card{fill:#161B22;stroke:#30363D}.ink{fill:#E6EDF3}.mu{fill:#8B949E}.track{fill:#30363D}
      .ac{fill:#3FB950}.acbg{fill:#3FB950;fill-opacity:.15}
    }
  </style>
  <rect x=".5" y=".5" width="439" height="209" rx="12" class="card"/>
  <text x="24" y="38" font-size="11" class="ac mono">EN PRODUCCIÓN · PRIVADO</text>
  <text x="24" y="68" font-size="24" font-weight="700" class="ink">Kapital Routing</text>
  <g font-size="13" class="mu">
    <text x="24" y="98">Programación de turnos y flota</text>
    <text x="24" y="117">para transporte de personal.</text>
    <text x="24" y="136">Reglas validadas en la base.</text>
  </g>
  <text x="24" y="184" font-size="11" class="mu mono">React · FastAPI · PostgreSQL</text>

  <g>
    <rect x="290" y="52" width="124" height="9" rx="4.5" class="track"/>
    <rect x="290" y="52" width="0" height="9" rx="4.5" class="ac"><animate attributeName="width" from="0" to="100" dur="1.2s" fill="freeze"/></rect>
    <rect x="290" y="80" width="124" height="9" rx="4.5" class="track"/>
    <rect x="290" y="80" width="0" height="9" rx="4.5" class="ac"><animate attributeName="width" from="0" to="76" dur="1.2s" begin=".15s" fill="freeze"/></rect>
    <rect x="290" y="108" width="124" height="9" rx="4.5" class="track"/>
    <rect x="290" y="108" width="0" height="9" rx="4.5" class="ac"><animate attributeName="width" from="0" to="118" dur="1.2s" begin=".3s" fill="freeze"/></rect>
    <rect x="290" y="136" width="124" height="9" rx="4.5" class="track"/>
    <rect x="290" y="136" width="0" height="9" rx="4.5" class="ac"><animate attributeName="width" from="0" to="58" dur="1.2s" begin=".45s" fill="freeze"/></rect>
    <g font-size="10" class="mu mono">
      <text x="290" y="46">turno 20:00</text>
      <text x="290" y="74">turno 22:00</text>
      <text x="290" y="102">turno 01:00</text>
      <text x="290" y="130">turno 03:00</text>
    </g>
    <rect x="290" y="158" width="124" height="22" rx="11" class="acbg"/>
    <text x="352" y="173" font-size="11" text-anchor="middle" class="ac mono">sin cruces de reserva</text>
  </g>
</svg>
