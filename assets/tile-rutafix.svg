<svg xmlns="http://www.w3.org/2000/svg" width="440" height="100" viewBox="0 0 440 100" role="img" aria-label="RutaFix: Rutas de intervención vial con K-Means (curso)">
  <style>
    text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .bg{fill:#FFF4EA}.ac{fill:#F97316}.st{fill:#9A3412}.n{fill:#1F2328}.d{fill:#59636E}.ring{stroke:#F97316}
    @media (prefers-color-scheme:dark){.bg{fill:#2C1A0E}.ac{fill:#FB923C}.st{fill:#FED7AA}.n{fill:#E6EDF3}.d{fill:#9198A1}.ring{stroke:#FB923C}}
  </style>
  <rect width="440" height="100" rx="16" class="bg"/>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".6s" begin="0.35s" fill="freeze"/>
    <circle cx="42" cy="50" r="20" class="ac"/>
    <text x="42" y="56.5" font-size="17" font-weight="700" text-anchor="middle" fill="#FFFFFF">R</text>
    <text x="76" y="45" font-size="17" font-weight="600" class="n">RutaFix</text>
    <text x="76" y="68" font-size="13.5" class="d">Rutas de intervención vial con K-Means</text>
    <text x="418" y="30" font-size="12" font-weight="500" text-anchor="end" class="st">curso ↗</text>
  </g>
</svg>
