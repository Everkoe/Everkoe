  <text x="82" y="37" font-size="10.5" text-anchor="middle" fill="#4ADE80" class="mono">CURSO · EQUIPO</text>
  <text x="24" y="78" font-size="25" font-weight="700" fill="#F0FDF4">RutaFix</text>
  <text x="24" y="102" font-size="13" fill="#86A394">Optimización de rutas de intervención vial.</text>
  <circle cx="30" cy="128" r="2.5" fill="#22C55E"/><text x="42" y="132" font-size="13" fill="#C7DDD0">Agrupa los puntos con K-Means antes de optimizar.</text><circle cx="30" cy="152" r="2.5" fill="#22C55E"/><text x="42" y="156" font-size="13" fill="#C7DDD0">Compara fuerza bruta, backtracking, vecino más</text><text x="42" y="175" font-size="13" fill="#C7DDD0">cercano y MST.</text><circle cx="30" cy="195" r="2.5" fill="#22C55E"/><text x="42" y="199" font-size="13" fill="#C7DDD0">Backend por capas (dominio e infraestructura) con</text><text x="42" y="218" font-size="13" fill="#C7DDD0">FastAPI.</text><circle cx="30" cy="238" r="2.5" fill="#22C55E"/><text x="42" y="242" font-size="13" fill="#C7DDD0">Mapa interactivo con Leaflet.</text>
  <rect x="24" y="288" width="61" height="22" rx="11" fill="#22C55E" fill-opacity=".1" stroke="#22C55E" stroke-opacity=".35"/><text x="55" y="303" font-size="11" text-anchor="middle" fill="#86EFAC" class="mono">Python</text><rect x="93" y="288" width="68" height="22" rx="11" fill="#22C55E" fill-opacity=".1" stroke="#22C55E" stroke-opacity=".35"/><text x="128" y="303" font-size="11" text-anchor="middle" fill="#86EFAC" class="mono">FastAPI</text><rect x="170" y="288" width="54" height="22" rx="11" fill="#22C55E" fill-opacity=".1" stroke="#22C55E" stroke-opacity=".35"/><text x="197" y="303" font-size="11" text-anchor="middle" fill="#86EFAC" class="mono">React</text><rect x="232" y="288" width="89" height="22" rx="11" fill="#22C55E" fill-opacity=".1" stroke="#22C55E" stroke-opacity=".35"/><text x="277" y="303" font-size="11" text-anchor="middle" fill="#86EFAC" class="mono">TypeScript</text><rect x="329" y="288" width="75" height="22" rx="11" fill="#22C55E" fill-opacity=".1" stroke="#22C55E" stroke-opacity=".35"/><text x="367" y="303" font-size="11" text-anchor="middle" fill="#86EFAC" class="mono">Tailwind</text><rect x="24" y="316" width="68" height="22" rx="11" fill="#22C55E" fill-opacity=".1" stroke="#22C55E" stroke-opacity=".35"/><text x="58" y="331" font-size="11" text-anchor="middle" fill="#86EFAC" class="mono">Leaflet</text>
