<svg xmlns="http://www.w3.org/2000/svg" width="440" height="210" viewBox="0 0 440 210" role="img" aria-label="Woodland Perú">
  <style>
    text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .card{fill:#F6F8FA;stroke:#D0D7DE}.ink{fill:#1F2328}.mu{fill:#656D76}
    .tile{fill:#FFFFFF;stroke:#D0D7DE}.bar{fill:#D0D7DE}
    .ac{fill:#9A6700}.acs{stroke:#9A6700}.acbg{fill:#9A6700;fill-opacity:.14}
    @media (prefers-color-scheme:dark){
      .card{fill:#161B22;stroke:#30363D}.ink{fill:#E6EDF3}.mu{fill:#8B949E}
      .tile{fill:#0D1117;stroke:#30363D}.bar{fill:#30363D}
      .ac{fill:#D29922}.acs{stroke:#D29922}.acbg{fill:#D29922;fill-opacity:.16}
    }
  </style>
  <rect x=".5" y=".5" width="439" height="209" rx="12" class="card"/>
  <text x="24" y="38" font-size="11" class="ac mono">EN DESARROLLO · EQUIPO WASD</text>
  <text x="24" y="68" font-size="24" font-weight="700" class="ink">Woodland Perú</text>
  <g font-size="13" class="mu">
    <text x="24" y="98">Web comercial y panel admin para</text>
    <text x="24" y="117">una MIPYME: catálogo, cotizaciones</text>
    <text x="24" y="136">e inventario.</text>
  </g>
  <text x="24" y="184" font-size="11" class="mu mono">React · Hono · Supabase</text>

  <g stroke-width="1">
    <rect x="288" y="34" width="62" height="66" rx="8" class="tile"/>
    <rect x="358" y="34" width="62" height="66" rx="8" class="tile acs" stroke-width="1.6">
      <animate attributeName="stroke-opacity" values="1;.35;1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="288" y="108" width="62" height="66" rx="8" class="tile"/>
    <rect x="358" y="108" width="62" height="66" rx="8" class="tile"/>
  </g>
  <g>
    <rect x="296" y="42" width="46" height="28" rx="4" class="bar"/>
    <rect x="366" y="42" width="46" height="28" rx="4" class="acbg"/>
    <rect x="296" y="116" width="46" height="28" rx="4" class="bar"/>
    <rect x="366" y="116" width="46" height="28" rx="4" class="bar"/>
    <rect x="296" y="78" width="30" height="5" rx="2.5" class="bar"/><rect x="296" y="88" width="18" height="5" rx="2.5" class="bar"/>
    <rect x="366" y="78" width="30" height="5" rx="2.5" class="ac"/><rect x="366" y="88" width="18" height="5" rx="2.5" class="bar"/>
    <rect x="296" y="152" width="30" height="5" rx="2.5" class="bar"/><rect x="296" y="162" width="18" height="5" rx="2.5" class="bar"/>
    <rect x="366" y="152" width="30" height="5" rx="2.5" class="bar"/><rect x="366" y="162" width="18" height="5" rx="2.5" class="bar"/>
  </g>
</svg>
