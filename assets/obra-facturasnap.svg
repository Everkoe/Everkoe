<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64" role="img" aria-label="FacturaSnap: Cálculo de IGV para facturas SUNAT (en línea)">
  <defs>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22C55E" stop-opacity=".55"/><stop offset=".6" stop-color="#22C55E" stop-opacity=".12"/><stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .n{font-family:Georgia,'Times New Roman',serif;fill:#1F2328}
    .d{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#59636E}
    .i{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#16A34A}
    .ac{fill:#16A34A;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .pb{fill:#DBEAFE}.pt{fill:#1E40AF;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    @media (prefers-color-scheme:dark){.n{fill:#E6EDF3}.d{fill:#9198A1}.i,.ac{fill:#4ADE80}.pb{fill:#1E3A8A}.pt{fill:#BFDBFE}}
  </style>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur=".6s" begin="0.48s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-12 0" to="0 0" dur=".6s" begin="0.48s" fill="freeze"/>
    <text x="2" y="37" font-size="12" class="i">05</text>
    <text x="40" y="39" font-size="22" class="n">FacturaSnap</text>
    <text x="270" y="37" font-size="14.5" class="d">Cálculo de IGV para facturas SUNAT</text>
    <rect x="784" y="20" width="80" height="24" rx="12" class="pb"/>
    <text x="824" y="36" font-size="12" text-anchor="middle" class="pt">en línea</text>
    <text x="898" y="36" font-size="16" text-anchor="end" class="ac">↗</text>
  </g>
  
</svg>
