<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-label="Flujo de un turno en Kapital Routing: Excel del cliente, API, PostgreSQL, programación y salida">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="270" rx="18" fill="#0B1220"/>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Cómo fluye un turno en Kapital Routing</text>
    <text x="450" y="62" text-anchor="middle" font-size="13" fill="#94A3B8">De la semanal del cliente a la programación aplicada</text>

    <!-- conectores -->
    <g stroke="#22C55E" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="5 6" stroke-linecap="round">
      <line x1="150" y1="140" x2="195" y2="140"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="1.2s" repeatCount="indefinite"/></line>
      <line x1="335" y1="140" x2="380" y2="140"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="1.2s" repeatCount="indefinite"/></line>
      <line x1="520" y1="140" x2="565" y2="140"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="1.2s" repeatCount="indefinite"/></line>
      <line x1="705" y1="140" x2="750" y2="140"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="1.2s" repeatCount="indefinite"/></line>
    </g>

    <!-- paquetes viajando -->
    <g fill="#86EFAC" filter="url(#glow)">
      <circle r="4"><animateMotion dur="2.4s" repeatCount="indefinite" path="M10 140 L890 140"/></circle>
      <circle r="4"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M10 140 L890 140"/></circle>
    </g>

    <!-- nodo 1 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.2s" fill="freeze"/>
      <rect x="10" y="100" width="140" height="80" rx="12" fill="url(#card)" stroke="#334155"/>
      <text x="80" y="132" text-anchor="middle" font-size="26">📄</text>
      <text x="80" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#E2E8F0">Excel del cliente</text>
      <text x="80" y="172" text-anchor="middle" font-size="11" fill="#94A3B8">semanal · novedades</text>
    </g>
    <!-- nodo 2 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.5s" fill="freeze"/>
      <rect x="195" y="100" width="140" height="80" rx="12" fill="url(#card)" stroke="#334155"/>
      <text x="265" y="132" text-anchor="middle" font-size="26">⚡</text>
      <text x="265" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#E2E8F0">API FastAPI</text>
      <text x="265" y="172" text-anchor="middle" font-size="11" fill="#94A3B8">sesión · roles · sede</text>
    </g>
    <!-- nodo 3 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.8s" fill="freeze"/>
      <rect x="380" y="100" width="140" height="80" rx="12" fill="url(#card)" stroke="#22C55E" stroke-opacity="0.7"/>
      <text x="450" y="132" text-anchor="middle" font-size="26">🐘</text>
      <text x="450" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#E2E8F0">PostgreSQL</text>
      <text x="450" y="172" text-anchor="middle" font-size="11" fill="#94A3B8">reglas · reservas · RLS</text>
    </g>
    <!-- nodo 4 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.1s" fill="freeze"/>
      <rect x="565" y="100" width="140" height="80" rx="12" fill="url(#card)" stroke="#334155"/>
      <text x="635" y="132" text-anchor="middle" font-size="26">🗂️</text>
      <text x="635" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#E2E8F0">Programación</text>
      <text x="635" y="172" text-anchor="middle" font-size="11" fill="#94A3B8">borrador · historial</text>
    </g>
    <!-- nodo 5 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.4s" fill="freeze"/>
      <rect x="750" y="100" width="140" height="80" rx="12" fill="url(#card)" stroke="#334155"/>
      <text x="820" y="132" text-anchor="middle" font-size="26">🚌</text>
      <text x="820" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#E2E8F0">Operación</text>
      <text x="820" y="172" text-anchor="middle" font-size="11" fill="#94A3B8">Excel · conductores</text>
    </g>

    <!-- etiquetas inferiores -->
    <g font-size="12" fill="#86EFAC" text-anchor="middle">
      <rect x="150" y="212" width="130" height="26" rx="13" fill="#22C55E" fill-opacity="0.12" stroke="#22C55E" stroke-opacity="0.4"/>
      <text x="215" y="229">Pruebas con PGlite</text>
      <rect x="295" y="212" width="130" height="26" rx="13" fill="#22C55E" fill-opacity="0.12" stroke="#22C55E" stroke-opacity="0.4"/>
      <text x="360" y="229">CI en GitHub</text>
      <rect x="440" y="212" width="130" height="26" rx="13" fill="#22C55E" fill-opacity="0.12" stroke="#22C55E" stroke-opacity="0.4"/>
      <text x="505" y="229">Deploy en Vercel</text>
      <rect x="585" y="212" width="165" height="26" rx="13" fill="#22C55E" fill-opacity="0.12" stroke="#22C55E" stroke-opacity="0.4"/>
      <text x="667" y="229">Deshacer / rehacer</text>
    </g>
  </g>
</svg>
